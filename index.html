<body><div id="root"></div><div id="toast" class="alert hidden"></div>
<script>
'use strict';
const $=q=>document.querySelector(q),root=$('#root');
let me=null,page='Dashboard',company=null,courses=[],selectedEmployee=2,peoplePage=1,peopleFilter='',learningEmployee=2,currentCourse=null,quizResult=null,voiceState={voice:null};
const PACKS=[{name:'Basic',price:99000,limit:20,features:['Asesmen kompetensi','Skill gap individu','Rekomendasi belajar dasar','Materi dasar','Monitoring dan feedback','Bantuan mandiri']},{name:'Professional',price:299000,limit:75,features:['Semua Basic','Analisis tim','Materi internal','Laporan perkembangan','Tiket kendala ke HR']},{name:'Business',price:799000,limit:250,features:['Semua Professional','Dashboard HR dan analitik jabatan','Ekspor laporan','Eskalasi ke mentor / trainer']},{name:'Enterprise',price:1500000,limit:Infinity,features:['Semua Business','Kustomisasi dan integrasi opsional','Kapasitas sesuai kebutuhan','Dukungan prioritas','AI sebagai rencana pengembangan']}];
const ABOUT={motto:'Grow. Learn. Perform Better.',vision:'Menjadi platform pengembangan kompetensi karyawan yang membantu perusahaan bertumbuh melalui pembelajaran terarah, terukur, dan berkelanjutan.',mission:['Memudahkan pemetaan kompetensi karyawan menggunakan asesmen terstruktur.','Menghubungkan hasil skill gap dengan pembelajaran yang relevan untuk pekerjaan.','Memudahkan HR memantau progres, asesmen ulang, dan feedback pengembangan.','Mendorong budaya belajar berkelanjutan lewat pengalaman belajar yang mudah diakses.']};
const NAVHR=[['Dashboard','▦'],['Karyawan','♙'],['Asesmen','☑'],['Skill Gap','▥'],['Pembelajaran','▤'],['Monitoring','◴'],['Bantuan','♧'],['Langganan','◈'],['Perusahaan','▣'],['Tentang ORBIPERA','◎']];
const NAVEMP=[['Dashboard','▦'],['Kompetensi Saya','◉'],['Pembelajaran','▤'],['Hasil Kuis','☷'],['Monitoring','◴'],['Bantuan','♧'],['Tentang ORBIPERA','◎']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rup=n=>'Rp'+Number(n).toLocaleString('id-ID');
const avg=x=>x.length?x.reduce((a,b)=>a+Number(b||0),0)/x.length:0;
const scoreFmt=n=>Number(n||0).toFixed(1),pct=n=>Math.round(Number(n||0));
function flash(text){let e=$('#toast');e.textContent=text;e.classList.remove('hidden');clearTimeout(window.__flash);window.__flash=setTimeout(()=>e.classList.add('hidden'),3700)}
async function api(path,body){let opt={credentials:'same-origin'};if(body!==undefined){opt.method='POST';opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(body)}let r=await fetch('/api/'+path,opt);let j=await r.json();if(!r.ok||!j.ok){if(r.status===401&&me){me=null;renderLanding()}throw Error(j.error||'Permintaan gagal')}return j.data}
function pict(id){return '/assets/'+id+'.jpg'}function avatar(name){return (name||'OR').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function title(name,desc,actions=''){return `<div class="pagehead"><div><h1>${esc(name)}</h1><p>${esc(desc)}</p></div><div class="row">${actions}</div></div>`}
function kpi(symbol,val,label){return `<div class="kpi"><span class="k-icon">${symbol}</span><strong>${esc(val)}</strong><small>${esc(label)}</small></div>`}
function bar(name,num,max=100,color=''){return `<div class="barrow"><span>${esc(name)}</span><div class="track"><div class="fill ${color}" style="width:${Math.min(100,Math.max(0,Number(num)/max*100))}%"></div></div><b>${scoreFmt(num)}${max===100?'%':''}</b></div>`}
function frame(html){$('#appmain').innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}
function setPage(p){page=p;$('.app')?.classList.remove('menu-open');renderApp()}

lay:flex;justify-content:space-between;color:#71809b;font-size:10px"><span>Assessment → Gap → Learning → Evaluation</span><span>● Ilustrasi data fiktif</span></div></div></div></section><section id="fitur" class="section"><h2 class="section-title">Satu platform, pengembangan lebih terarah</h2><p class="sub">Fitur inti ORBIPERA dirancang untuk mendukung pekerjaan HR dan perjalanan belajar karyawan.</p><div class="featuregrid">${[['☑','Competency Assessment','Asesmen berbasis rubrik dan standar kompetensi.'],['▥','Skill Gap Analysis','Bandingkan kompetensi aktual dengan target pekerjaan.'],['▤','Personal Learning','Video, modul PDF, dan kuis dengan evaluasi otomatis.'],['◴','Progress Monitoring','Pantau progres, hasil kuis, dan umpan balik.'],['♧','Learning Support','Karyawan melaporkan kendala belajar kepada HR.']].map(x=>`<article class="feature"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><section id="tentang" class="section"><h2 class="section-title">Tentang ORBIPERA</h2><p class="sub">Grow. Learn. Perform Better.</p><div class="missiongrid"><div class="surface"><span class="eyebrow">VISI KAMI</span><h3>Setiap potensi punya ruang untuk berkembang.</h3><p>${esc(ABOUT.vision)}</p><img src="/assets/orbipera-logo-transparent.png" alt="ORBIPERA" class="logohero"></div><div class="surface"><span class="eyebrow">MISI KAMI</span><h3>Belajar yang nyata, hasil yang terukur.</h3><ul>${ABOUT.mission.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="sidepanel"><b>Untuk perusahaan berkembang</b><p>ORBIPERA membantu HR dan karyawan mengelola proses pengembangan dalam satu sistem terstruktur.</p></div></div></div></section><section id="paket" class="section"><h2 class="section-title">Pilih paket sesuai kebutuhan perusahaan</h2><p class="sub">Harga ilustratif rancangan bisnis ORBIPERA. Perbandingan paket tersedia setelah masuk.</p><div class="pricinggrid">${PACKS.map(x=>`<article class="plan-card"><span class="eyebrow">ORBIPERA</span><h3>${x.name}</h3><div class="cost">${rup(x.price)}<small> / bulan</small></div><div class="muted small">${Number.isFinite(x.limit)?'Maksimal '+x.limit+' karyawan':'Kapasitas sesuai kebutuhan'}</div><ul>${x.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><button class="btn primary block" onclick="openLogin()">Jelajahi Paket</button></article>`).join('')}</div></section><footer class="footer"><b>ORBIPERA</b> · Grow. Learn. Perform Better.<div style="margin-top:6px">Website produk pengembangan kompetensi · Semua data pengguna dan perusahaan adalah contoh fiktif.</div></footer></div><div id="loginshade" class="hidden"></div>`}
function openLogin(){let box=$('#loginshade');box.className='';box.innerHTML=`<div style="position:fixed;inset:0;background:#091b3dd9;z-index:100;display:grid;place-items:center;padding:18px;overflow:auto" onclick="if(event.target===this)closeLogin()"><div class="surface" style="width:min(100%,485px);padding:30px;box-shadow:0 28px 80px #06152a70"><div class="row between"><h2 style="margin:0">Masuk ke ORBIPERA</h2><button class="btn sm" onclick="closeLogin()">✕</button></div><p class="small muted">Gunakan akun demo untuk mengakses aplikasi dengan data fiktif. Perubahan disimpan dalam database server.</p><div class="row" style="margin:18px 0"><button class="btn sm subtle" onclick="fillLogin('admin@orbipera.demo','Admin123!')">👨‍💼 Akun HR</button><button class="btn sm subtle" onclick="fillLogin('andi.rahman@orbipera.demo','Karyawan123!')">👩‍💻 Akun Karyawan</button></div><form onsubmit="submitLogin(event)"><label class="field">Email<input id="email" type="email" autocomplete="username" placeholder="Email akun" required value="admin@orbipera.demo"></label><label class="field">Kata sandi<input id="password" type="password" autocomplete="current-password" required value="Admin123!"></label><label class="row small muted" style="margin:0 0 14px"><input type="checkbox" onchange="$('#password').type=this.checked?'text':'password'"> Tampilkan kata sandi</label><p id="loginerror" style="min-height:22px;font-size:12px;color:#a43e4a"></p><button class="btn primary block" type="submit">Masuk ke Dashboard →</button></form><p class="tiny muted" style="line-height:1.6">Akun ini hanya untuk demo. Jangan gunakan informasi pribadi atau data perusahaan nyata.</p></div></div>`}
function closeLogin(){let e=$('#loginshade');if(e){e.className='hidden';e.innerHTML=''}}
function fillLogin(a,b){$('#email').value=a;$('#password').value=b}
async function submitLogin(e){e.preventDefault();$('#loginerror').textContent='';try{let r=await api('login',{email:$('#email').value,password:$('#password').value});me=r.user;company=await api('company');courses=await api('catalog');page='Dashboard';renderApp();flash('Selamat datang di ORBIPERA, '+me.name)}catch(err){$('#loginerror').textContent=err.message}}
async function logout(){try{await api('logout',{})}catch(e){};me=null;renderLanding()}
async function start(){try{let s=await api('session');company=await api('company');courses=await api('catalog');if(s.user){me=s.user;renderApp()}else renderLanding()}catch(e){root.innerHTML=`<div class="section"><h1>ORBIPERA</h1><div class="notice warning">Server aplikasi tidak terhubung. Jalankan <code>python server.py</code> dari folder website lalu buka alamat yang muncul. File HTML saja tidak bisa menyimpan database lintas perangkat.</div></div>`}}
async function renderApp(){root.innerHTML=navbar();try{await renderPage()}catch(e){frame(title('Gagal memuat halaman',e.message)+'<button class="btn" onclick="renderApp()">Coba lagi</button>')}}
async function renderPage(){switch(page){case'Dashboard':return dash();case'Karyawan':return employees();case'Asesmen':case'Kompetensi Saya':return skills();case'Skill Gap':return skillgap();case'Pembelajaran':return learn();case'Kursus':return coursePage();case'Hasil Kuis':return attempts();case'Monitoring':return monitoring();case'Bantuan':return help();case'Langganan':return pricing();case'Perusahaan':return companyPage();case'Tentang ORBIPERA':return about();default:return dash()}}
async function dash(){let d=await api('dashboard');if(me.role==='hr'){let dept=d.departments||[];frame(title('Dashboard HR','Ringkasan perkembangan kompetensi dan aktivitas pembelajaran di perusahaan.')+`<div class="notice">📊 Data terhubung ke database SQLite lokal. Perubahan asesmen, progres kursus, tiket, dan kuis tersimpan secara nyata. Profil perusahaan dan pengguna dalam aplikasi ini masih fiktif.</div><div class="kpis">${kpi('👥',d.total,'Karyawan Aktif')}${kpi('⭐',scoreFmt(d.score)+'/5','Kompetensi Rata-rata')}${kpi('▤',d.progress+'%','Progres Pembelajaran')}${kpi('♧',d.tickets,'Tiket Belum Selesai')}</div><div class="grid2"><div class="panel"><h3>Distribusi Divisi</h3>${dept.map(x=>bar(x.department,x.count,d.total)).join('')}<div class="row"><button class="btn sm" onclick="setPage('Karyawan')">Lihat karyawan →</button></div></div><div class="panel"><h3>Alur Pengembangan ORBIPERA</h3><div class="sidepanel"><b>01 · Asesmen Kompetensi</b><p class="small muted">Lakukan penilaian berbasis rubrik skala 1–5.</p><b>02 · Analisis Skill Gap</b><p class="small muted">Temukan prioritas kebutuhan pengembangan.</p><b>03 · Pembelajaran & Kuis</b><p class="small muted">Video dan modul PDF dilengkapi penilaian otomatis.</p><b>04 · Progress Monitoring</b><p class="small muted">Pantau perubahan dan umpan balik pembelajaran.</p></div></div></div><div class="panel"><h3>Langkah Cepat</h3><div class="row"><button class="btn primary" onclick="setPage('Asesmen')">☑ Mulai Asesmen</button><button class="btn" onclick="setPage('Pembelajaran')">▶ Lihat Materi</button><button class="btn" onclick="setPage('Langganan')">◈ Bandingkan Paket</button><button class="btn" onclick="setPage('Monitoring')">◴ Pantau Perkembangan</button></div></div>`)}else{let s=d.scores||[],pr=d.progress||[];let gap=s.map(x=>({k:x.competency,g:Math.max(0,({Komunikasi:4.3,'Kerja Sama':4.2,'Problem Solving':4.1,'Kompetensi Teknis':4.5,Kepemimpinan:4}[x.competency]||4)-x.score)})).sort((a,b)=>b.g-a.g);frame(title('Halo, '+me.name+' 👋','Lanjutkan pengembangan diri melalui materi yang relevan.')+`<div class="notice">⭐ Selamat datang di portal belajar ORBIPERA. Progres belajar dan hasil kuis otomatis tersimpan di akunmu.</div><div class="kpis">${kpi('★',scoreFmt(avg(s.map(x=>x.score)))+'/5','Skor Kompetensi')}${kpi('▤',pct(avg(pr.map(x=>x.percent)))+'%','Rata-rata Belajar')}${kpi('▥',scoreFmt(gap[0]?.g||0),'Skill Gap Tertinggi')}${kpi('♧',d.tickets,'Tiket Aktif')}</div><div class="grid2"><div class="panel"><h3>Kompetensi Saya</h3>${s.map(x=>bar(x.competency,x.score,5)).join('')}<button class="btn sm" onclick="setPage('Kompetensi Saya')">Lihat Kompetensi →</button></div><div class="panel"><h3>Rekomendasi Pengembangan</h3>${gap.slice(0,3).map(x=>`<div class="row between" style="padding:13px 0;border-bottom:1px solid #edf0f7"><div><b>${esc(x.k)}</b><div class="small muted">Gap ${scoreFmt(x.g)}</div></div><span class="pill purple">Prioritas</span></div>`).join('')}<button class="btn primary sm" style="margin-top:14px" onclick="setPage('Pembelajaran')">Buka Kelas →</button></div></div>`)} }
async function employees(){let data=await api('employees?q='+encodeURIComponent(peopleFilter)+'&page='+peoplePage);frame(title('Data Karyawan','Kelola dan tinjau 360 profil karyawan fiktif.')+`<div class="panel"><div class="row between" style="margin-bottom:16px"><div style="min-width:220px;flex:1"><input class="search" type="search" id="employee-search" placeholder="Cari nama, email, jabatan, divisi" value="${esc(peopleFilter)}" onkeydown="if(event.key==='Enter')filterEmployees()"></div><button class="btn primary" onclick="filterEmployees()">Cari</button></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Nama</th><th>Jabatan</th><th>Divisi</th><th>Skor rata-rata</th><th>Belajar</th><th>Tindakan</th></tr></thead><tbody>${data.rows.map(p=>`<tr><td><strong>${esc(p.name)}</strong><div class="tiny muted">${esc(p.email)}</div></td><td>${esc(p.position)}</td><td>${esc(p.department)}</td><td>${scoreFmt(p.score)}/5</td><td><span class="pill green">${p.progress}%</span></td><td><button class="btn sm" onclick="selectedEmployee=${p.id};setPage('Asesmen')">Asesmen</button></td></tr>`).join('')}</tbody></table></div><div class="pagin"><span>${data.total} karyawan · Halaman ${data.page}</span><div class="row"><button class="btn sm" ${data.page===1?'disabled':''} onclick="peoplePage--;renderPage()">Sebelumnya</button><button class="btn sm" ${data.page*data.limit>=data.total?'disabled':''} onclick="peoplePage++;renderPage()">Berikutnya</button></div></div></div>`)}
function filterEmployees(){peopleFilter=$('#employee-search').value;peoplePage=1;renderPage()}
async function employeeSelectMarkup(){let data=await api('employees?page=1');return `<label class="field" style="max-width:360px">Pilih Karyawan<select onchange="selectedEmployee=Number(this.value);renderPage()">${data.rows.map(p=>`<option value="${p.id}" ${selectedEmployee===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><p class="small muted">Cari karyawan lain melalui menu Data Karyawan.</p>`}
async function skills(){let ishr=me.role==='hr';let target=ishr?selectedEmployee:me.id;let items=await api('skills?user_id='+target);frame(title(ishr?'Asesmen Kompetensi':'Kompetensi Saya',ishr?'Nilai kompetensi karyawan menggunakan skala 1–5.':'Hasil asesmen yang diberikan HR dan selisih terhadap target.')+(ishr?`<div class="panel">${await employeeSelectMarkup()}</div>`:'')+`<div class="grid2"><div class="panel"><h3>Rubrik Asesmen</h3><p class="small muted" style="line-height:1.7">1 = perlu pengembangan dasar; 2 = berkembang; 3 = cukup; 4 = baik; 5 = sangat baik. Target ditetapkan perusahaan.</p>${items.map(x=>`<div style="padding:13px 0;border-bottom:1px solid #eef1f6"><div class="row between"><b style="font-size:13px">${esc(x.competency)}</b><span class="pill purple" id="score${esc(x.competency).replace(/\W/g,'')}">${scoreFmt(x.score)} / ${scoreFmt(x.target)}</span></div>${ishr?`<div class="row" style="margin-top:10px"><input type="range" min="1" max="5" step="0.1" style="flex:1;accent-color:#6757db" value="${x.score}" id="s${encodeURIComponent(x.competency)}" oninput="this.nextElementSibling.textContent=this.value"><b>${x.score}</b><button class="btn sm primary" onclick="saveSkill('${encodeURIComponent(x.competency)}')">Simpan</button></div>`:bar('',x.score,5)}</div>`).join('')}</div><div class="panel"><h3>Ringkasan Kesenjangan</h3>${items.map(x=>bar(x.competency,Math.max(0,x.target-x.score),2)).join('')}<p class="small muted">Skill gap merupakan selisih positif antara target dan skor aktual. Nilai yang lebih tinggi menandakan kebutuhan belajar yang lebih mendesak.</p></div></div>`)}
async function saveSkill(code){let comp=decodeURIComponent(code);let input=document.getElementById('s'+code);let score=Number(input.value);try{await api('score',{user_id:selectedEmployee,competency:comp,score});flash('Penilaian '+comp+' tersimpan ke database');renderPage()}catch(e){flash(e.message)}}
async function skillgap(){let items=await api('skills?user_id='+selectedEmployee);frame(title('Skill Gap Analysis','Bandingkan nilai kompetensi aktual dengan standar perusahaan.')+`<div class="panel">${await employeeSelectMarkup()}</div><div class="grid2"><div class="panel"><h3>Profil Kompetensi</h3>${items.map(x=>bar(x.competency,x.score,5)).join('')}</div><div class="panel"><h3>Prioritas Skill Gap</h3>${items.slice().sort((a,b)=>(b.target-b.score)-(a.target-a.score)).map((x,i)=>`<div class="row between" style="padding:15px 0;border-bottom:1px solid #eaeef7"><div><b>${i+1}. ${esc(x.competency)}</b><p class="tiny muted" style="margin:5px 0">Aktual ${scoreFmt(x.score)} · Target ${scoreFmt(x.target)}</p></div><span class="pill ${x.target-x.score>.7?'orange':'green'}">Gap ${scoreFmt(Math.max(0,x.target-x.score))}</span></div>`).join('')}<button class="btn primary sm" style="margin-top:20px" onclick="setPage('Pembelajaran')">Lihat Rekomendasi →</button></div></div>`)}
async function learn(){let uid=me.role==='hr'?learningEmployee:me.id;let pr=await api('progress?user_id='+uid);let sc=await api('skills?user_id='+uid);let gaps={};sc.forEach(x=>gaps[x.competency]=Math.max(0,x.target-x.score));let sorted=courses.slice().sort((a,b)=>(gaps[b.competency]||0)-(gaps[a.competency]||0));frame(title('Pembelajaran','Katalog kelas dengan video bersuara, modul PDF, dan kuis yang dinilai otomatis.')+`<div class="notice">🎓 Rekomendasi diurutkan berdasarkan skill gap. Tonton video, pelajari modul PDF, lalu kerjakan kuis untuk mengukur pemahaman.</div>${me.role==='hr'?`<div class="panel">${await learningSelectMarkup()}</div>`:''}<div class="coursegrid">${sorted.map(c=>{let progress=pr.find(x=>x.course_id===c.id)?.percent||0;let state=progress>=100?'Selesai':progress>0?'Sedang dipelajari':'Belum dimulai';return `<article class="course"><div class="courseimage"><img loading="lazy" src="${pict(c.id)}" alt="${esc(c.title)}"><span class="tag">${esc(c.competency)}</span></div><div class="coursecontent"><span class="eyebrow">KELAS PENGEMBANGAN</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="meta"><span>◷ ${esc(c.duration)}</span><span>▶ Video bersuara</span><span>▤ PDF + kuis</span></div><div class="progresslabel"><span>${state}</span><b>${progress}%</b></div><div class="track"><div class="fill teal" style="width:${progress}%"></div></div><button class="btn primary block" onclick="currentCourse='${c.id}';page='Kursus';renderApp()">Buka Pembelajaran →</button></div></article>`}).join('')}</div>`)}
async function learningSelectMarkup(){let d=await api('employees?page=1');return `<label class="field" style="max-width:350px">Tinjau pembelajaran karyawan<select onchange="learningEmployee=Number(this.value);renderPage()">${d.rows.map(x=>`<option value="${x.id}" ${learningEmployee===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`}

 c4:'Selamat datang di kelas kompetensi teknis. Dalam pekerjaan sehari-hari, standar operasi membantu tim menghasilkan kualitas yang konsisten. Pelajari setiap langkah SOP, gunakan checklist, dan catat kendala teknis agar perbaikan dapat dilakukan. Sesudah materi ini, kamu dapat membuka modul PDF dan mengerjakan kuis asesmen.',
 c5:'Selamat datang di kelas dasar-dasar kepemimpinan. Pemimpin yang efektif memberikan arah jelas, mendengarkan anggota tim, dan membantu rekan berkembang. Praktikkan coaching melalui pertanyaan terbuka, berikan umpan balik spesifik, dan delegasikan pekerjaan dengan target yang terukur. Lanjutkan ke modul dan kuis untuk mengevaluasi pemahaman.'
};
function stopNarration(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function readNarration(){if(!('speechSynthesis'in window)){flash('Perangkat ini tidak mendukung pembaca suara bawaan. Putar video MP4 di atas.');return}stopNarration();let s=new SpeechSynthesisUtterance(SCRIPTS[currentCourse]||'');s.lang='id-ID';s.rate=.96;s.pitch=1.04;s.volume=1;let v=speechSynthesis.getVoices();let ind=v.find(x=>x.lang.toLowerCase()==='id-id'&&/natural|online|google|microsoft|premium/i.test(x.name))||v.find(x=>x.lang.toLowerCase().startsWith('id'));if(ind)s.voice=ind;let video=$('#coursevideo');video?.pause();speechSynthesis.speak(s);flash('Narasi dibacakan menggunakan suara bahasa Indonesia yang tersedia di perangkatmu.')}
async function coursePage(){if(!currentCourse)return setPage('Pembelajaran');let c=courses.find(x=>x.id===currentCourse);if(!c)return setPage('Pembelajaran');let target=me.role==='hr'?learningEmployee:me.id;let pr=await api('progress?user_id='+target),value=pr.find(x=>x.course_id===c.id)?.percent||0;quizResult=null;frame(title('Ruang Pembelajaran','Pelajari materi, tonton video, unduh modul, lalu ikuti kuis.',`<button class="btn sm" onclick="stopNarration();setPage('Pembelajaran')">← Kembali ke Katalog</button>`)+`<div class="coursepage-hero"><img class="photo" src="${pict(c.id)}" alt="${esc(c.title)}"><div class="details"><span class="eyebrow">ORBIPERA LEARNING</span><h2>${esc(c.title)}</h2><p>${esc(c.description)}</p><div class="row"><span>◷ ${esc(c.duration)}</span><span>▤ 3 Modul PDF</span><span>☑ 5 Soal Kuis</span></div><div class="row" style="margin-top:15px"><span class="pill ${value===100?'green':'purple'}">Progres: ${value}%</span><span class="pill">${esc(c.level)}</span></div></div></div><div class="course-layout"><div><div class="panel"><h3>▶ Video Pembelajaran dengan Audio</h3><video class="video" id="coursevideo" controls preload="metadata" onended="recordLearningEvent('video_finished')" poster="${pict(c.id)}"><source src="/assets/${c.id}-video.mp4" type="video/mp4">Browser tidak mendukung video MP4.</video><p class="small muted" style="line-height:1.7">Video MP4 berisi narasi sintetis bahasa Indonesia dan musik. Untuk suara alternatif yang lebih natural, gunakan pembaca suara bahasa Indonesia di perangkatmu.</p><div class="row"><button class="btn sm" onclick="readNarration()">🔊 Bacakan Ringkasan</button><button class="btn sm" onclick="stopNarration()">◼ Hentikan Narasi</button></div></div><div class="panel"><div class="row between"><h3 style="margin:0">Kuis Evaluasi</h3><span class="pill purple">5 soal · Lulus ≥ 70%</span></div><div id="quiz">Memuat pertanyaan…</div></div></div><div><div class="panel"><h3>Modul Pembelajaran</h3>${(LESSONS[c.id]||[]).map((m,i)=>`<div class="lessonitem"><div class="lessonnum">${i+1}</div><div><h4>${esc(m[0])}</h4><p>${esc(m[1])}</p></div></div>`).join('')}<a class="btn primary block" href="/assets/${c.id}-modul.pdf" target="_blank" rel="noopener" onclick="recordLearningEvent('module_opened')" style="margin-top:8px">▤ Buka Modul PDF</a><a class="btn block" href="/assets/${c.id}-modul.pdf" download="ORBIPERA_${c.id}_Modul.pdf" onclick="recordLearningEvent('module_opened')" style="margin-top:10px">↓ Unduh Modul</a></div><div class="panel"><h3>Progres & Umpan Balik</h3><div class="sidepanel"><b>Progres saat ini: ${value}%</b><p class="small muted">Progres bertambah ketika video selesai ditonton, modul PDF dibuka, dan kuis berhasil dikerjakan. Kelulusan kuis (≥70%) menandai kelas selesai (100%).</p></div><div style="height:1px;background:#edf0f7;margin:19px 0"></div><label class="field">Rating Kelas<select id="rating"><option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option><option value="2">★★ (2)</option><option value="1">★ (1)</option></select></label><label class="field">Komentar<textarea id="feedbacktext" placeholder="Apa yang kamu pelajari? Saran untuk materi ini?"></textarea></label><button class="btn block" onclick="saveFeedback()">Kirim Feedback</button></div></div></div>`);let q=await api('quizzes?course_id='+currentCourse);$('#quiz').innerHTML=`<form id="quizform" onsubmit="submitQuiz(event)">${q.map((x,i)=>`<div class="quizitem"><h4>${i+1}. ${esc(x.prompt)}</h4>${x.choices.map((a,j)=>`<label class="choice"><input type="radio" name="q${x.id}" value="${j}" required><span>${esc(a)}</span></label>`).join('')}</div>`).join('')}<button class="btn primary" style="margin-top:20px" type="submit">Periksa Jawaban & Lihat Nilai →</button></form><div id="quiz-result" style="margin-top:15px"></div>`}
async function submitQuiz(e){e.preventDefault();let d=new FormData(e.target);let a={};for(let [key,value] of d.entries())a[key.slice(1)]=Number(value);try{let res=await api('quiz-submit',{course_id:currentCourse,answers:a});let results=res.details.map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid #bcd7c8;font-size:12px"><b>${i+1}. ${x.is_correct?'✓ Benar':'✕ Belum tepat'}</b><div>${esc(x.explanation)}</div></div>`).join('');$('#quiz-result').innerHTML=`<div class="result ${res.passed?'':'fail'}"><strong>${res.score}% · ${res.passed?'LULUS':'PERLU ULANG'}</strong><p>${res.correct}/${res.total} benar. ${res.passed?'Kursus ditandai selesai di database.':'Pelajari modul lalu coba kembali.'}</p>${results}<button class="btn sm" style="margin-top:13px" onclick="setPage('Hasil Kuis')">Lihat Riwayat</button></div>`;$('#quiz-result').scrollIntoView({behavior:'smooth',block:'center'});flash('Hasil kuis: '+res.score+'%'+(res.passed?' — Lulus':' — Belum lulus'))}catch(err){flash(err.message)}}
async function recordLearningEvent(kind){if(me.role==='hr')return;try{let r=await api('learning-event',{course_id:currentCourse,kind});flash(kind==='video_finished'?'Video selesai, progres tercatat.':'Modul dibuka, progres tercatat.')}catch(e){flash(e.message)}}
async function saveFeedback(){try{await api('feedback-create',{course_id:currentCourse,rating:Number($('#rating').value),comment:$('#feedbacktext').value});$('#feedbacktext').value='';flash('Feedback tersimpan di database')}catch(e){flash(e.message)}}
async function attempts(){if(me.role!=='employee')return setPage('Monitoring');let data=await api('attempts');frame(title('Hasil Kuis Saya','Riwayat penilaian pembelajaran tersimpan dalam database akunmu.')+`<div class="panel">${data.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Materi</th><th>Nilai</th><th>Status</th><th>Waktu</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(courses.find(c=>c.id===x.course_id)?.title||x.course_id)}</td><td><strong>${x.percent}%</strong></td><td><span class="pill ${x.percent>=70?'green':'orange'}">${x.percent>=70?'Lulus':'Belum Lulus'}</span></td><td>${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Belum ada kuis yang dikerjakan. Buka Pembelajaran dan coba evaluasi.</div>'}</div>`)}
async function monitoring(){if(me.role==='hr'){let d=await api('hr-monitor'),feedback=await api('feedback');frame(title('Progress Monitoring','Pemantauan kemajuan belajar dan feedback karyawan.')+`<div class="kpis">${kpi('👥',360,'Total Karyawan')}${kpi('▤',pct(avg(d.map(x=>x.progress)))+'%','Rerata sampel teratas')}${kpi('⭐',feedback.length,'Feedback Terekam')}${kpi('◴','Aktif','Monitoring Pembelajaran')}</div><div class="grid2"><div class="panel"><h3>Progres Belajar Karyawan</h3>${d.slice(0,12).map(x=>bar(x.name,x.progress,100,'teal')).join('')}<p class="tiny muted">Tampilan menampilkan 12 karyawan dengan progres tertinggi untuk ringkasan. Data progres tersimpan per karyawan dan kursus.</p></div><div class="panel"><h3>Feedback Pelatihan</h3>${feedback.slice(0,10).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #edf1f7"><b>${esc(x.name)} · ${'★'.repeat(x.rating)}</b><p class="small muted" style="margin:6px 0;line-height:1.6">${esc(x.comment)}</p></div>`).join('')}</div></div>`)}else{let d=await api('progress'),avgval=pct(avg(d.map(x=>x.percent)));frame(title('Progres Pembelajaran','Lihat progres setiap kelas dan lanjutkan materi.')+`<div class="kpis">${kpi('▤',avgval+'%','Rata-rata Progres')}${kpi('☑',d.filter(x=>x.percent===100).length,'Kelas Selesai')}${kpi('▶',d.length,'Kelas Tersedia')}${kpi('★','70%','Nilai Kelulusan')}</div><div class="panel"><h3>Semua Kelas</h3>${d.map(x=>bar(courses.find(c=>c.id===x.course_id)?.title||x.course_id,x.percent,100,'teal')).join('')}<button class="btn primary" onclick="setPage('Pembelajaran')">Lanjutkan Pembelajaran</button></div>`)} }
async function help(){let t=await api('tickets');frame(title('Learning Support','Laporan kendala materi belajar dan penanganan oleh HR.')+`<div class="grid2"><div class="panel"><h3>Buat Tiket Pembelajaran</h3><form onsubmit="createTicket(event)"><label class="field">Subjek<input name="subject" required minlength="4" maxlength="100" placeholder="Misalnya, tidak dapat membuka video"></label><label class="field">Penjelasan Kendala<textarea name="description" required minlength="10" maxlength="1000" placeholder="Jelaskan kendala pembelajaran yang dialami"></textarea></label><button class="btn primary" type="submit">Kirim Tiket →</button></form><p class="small muted" style="line-height:1.8">Tiket ditujukan ke HR Admin. Ini bukan layanan pengaduan HR umum.</p></div><div class="panel"><h3>${me.role==='hr'?'Tiket dari Karyawan':'Tiket Saya'} · ${t.length}</h3><div style="max-height:600px;overflow:auto">${t.slice(0,40).map(x=>`<div style="padding:13px 0;border-bottom:1px solid #eaf0fa"><div class="row between"><b class="small">${esc(x.subject)}</b><span class="pill ${x.status==='Selesai'?'green':x.status==='Diproses'?'purple':'orange'}">${esc(x.status)}</span></div><p class="tiny muted" style="line-height:1.65">${esc(x.name)} · ${esc(x.description)}</p>${x.reply?`<p class="small"><b>Tanggapan:</b> ${esc(x.reply)}</p>`:''}${me.role==='hr'?`<button class="btn sm" onclick="editTicket(${x.id},'${esc(x.status)}')">Tanggapi →</button>`:''}</div>`).join('')}</div></div></div>`)}
async function createTicket(e){e.preventDefault();let d=new FormData(e.target);try{await api('ticket-create',{subject:d.get('subject'),description:d.get('description')});flash('Laporan pembelajaran berhasil dikirim');renderPage()}catch(e){flash(e.message)}}
async function editTicket(id,current){let status=prompt('Status tiket (Baru / Diproses / Selesai):',current);if(status===null)return;let reply=prompt('Tanggapan HR kepada karyawan:','');if(reply===null)return;try{await api('ticket-update',{id,status,reply});flash('Tiket berhasil diperbarui');renderPage()}catch(e){flash(e.message)}}
let annual=false;
async function pricing(){company=await api('company');frame(title('Paket Langganan','Bandingkan seluruh paket dengan harga dan kapasitas yang konsisten dengan proposal.')+`<div class="notice">Paket aktif: <strong>${esc(company.plan)}</strong>. Seluruh paket bisa dipilih untuk pengujian fitur. Ini bukan pembayaran nyata; data 360 karyawan tetap tersedia meski melebihi kuota paket yang dipilih.</div><div class="row between" style="margin:0 0 20px"><div><b>Simulasi Pilihan Paket</b><p class="small muted">Diskon 15% untuk paket tahunan Basic, Professional, dan Business.</p></div><div class="row"><button class="btn sm ${annual?'':'primary'}" onclick="annual=false;renderPage()">Bulanan</button><button class="btn sm ${annual?'primary':''}" onclick="annual=true;renderPage()">Tahunan</button></div></div><div class="pricinggrid">${PACKS.map(p=>{let y=annual&&p.name!=='Enterprise',amount=y?Math.round(p.price*12*.85):p.price;return `<article class="plan-card ${company.plan===p.name?'active':''}"><span class="eyebrow">ORBIPERA · ${esc(p.name)}</span><h3>${p.name}</h3><div class="cost">${rup(amount)}<small> / ${y?'tahun':'bulan'}</small></div><span class="pill ${Number.isFinite(p.limit)&&360>p.limit?'orange':'green'}">${Number.isFinite(p.limit)?`Hingga ${p.limit} karyawan`:'Kapasitas kustom'}</span><ul>${p.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn ${company.plan===p.name?'subtle':'primary'} block" onclick="selectPlan('${p.name}')">${company.plan===p.name?'✓ Paket Aktif':'Pilih Paket '+p.name}</button></article>`}).join('')}</div><div class="panel" style="margin-top:20px"><h3>Perbandingan Fasilitas</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Fasilitas</th>${PACKS.map(x=>`<th>${x.name}</th>`).join('')}</tr></thead><tbody>${[['Kapasitas','20','75','250','Kustom'],['Asesmen','✓','✓','✓','✓'],['Skill gap individu','✓','✓','✓','✓'],['Analisis tim','—','✓','✓','✓'],['Materi internal','—','✓','✓','✓'],['Tiket ke HR','—','✓','✓','✓'],['Analitik jabatan','—','—','✓','✓'],['Eskalasi mentor','—','—','✓','✓'],['Integrasi opsional','—','—','—','✓']].map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?'<b>':''}${esc(v)}${i===0?'</b>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`)}
async function selectPlan(p){try{await api('plan',{plan:p});company=await api('company');flash('Paket '+p+' sekarang dipilih. Tidak ada pembayaran.');renderApp()}catch(e){flash(e.message)}}
async function companyPage(){company=await api('company');frame(title('Profil Perusahaan','Identitas organisasi pelanggan yang menggunakan ORBIPERA.')+`<div class="grid2"><div class="panel"><h3>Informasi Perusahaan</h3><form onsubmit="saveCompany(event)"><label class="field">Nama Perusahaan<input name="name" value="${esc(company.name)}" required></label><label class="field">Bidang Usaha<input name="industry" value="${esc(company.industry)}"></label><label class="field">Lokasi<input name="address" value="${esc(company.address)}"></label><label class="field">Deskripsi<textarea name="description">${esc(company.description)}</textarea></label><button class="btn primary" type="submit">Simpan Profil</button></form></div><div class="panel"><h3>Informasi Langganan</h3><div class="sidepanel"><p><b>Perusahaan:</b> ${esc(company.name)}</p><p><b>Paket:</b> ${esc(company.plan)}</p><p><b>Karyawan:</b> 360 (data fiktif)</p><p class="small muted">Profil di sini adalah profil perusahaan pengguna ORBIPERA, bukan profil penyedia ORBIPERA. Informasi tersimpan ke database ketika HR menyimpan.</p></div><button class="btn sm" style="margin-top:17px" onclick="setPage('Langganan')">Kelola Paket →</button></div></div>`)}
async function saveCompany(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());try{await api('company',o);flash('Profil perusahaan disimpan');company=await api('company');renderApp()}catch(e){flash(e.message)}}
function about(){frame(title('Tentang ORBIPERA','Profil, visi, misi, dan nilai yang menjadi dasar platform.')+`<div class="grid2"><div class="panel" style="display:grid;place-items:center"><img src="/assets/orbipera-logo-transparent.png" class="logohero" alt="Logo ORBIPERA"><div class="muted small" style="text-align:center">Smart Employee Development Platform</div></div><div class="panel"><span class="eyebrow">ABOUT US</span><h2 style="font-size:28px;line-height:1.2">${esc(ABOUT.motto)}</h2><p class="muted" style="line-height:1.8">ORBIPERA merupakan platform B2B SaaS yang menghubungkan asesmen kompetensi, skill gap, rekomendasi pembelajaran, monitoring, dan dukungan belajar. Didesain untuk membantu HR membuat pengembangan karyawan lebih jelas dan terukur.</p><div class="row"><span class="pill purple">Assessment</span><span class="pill purple">Learning</span><span class="pill purple">Monitoring</span></div></div></div><div class="grid2"><div class="panel"><h3>Visi ORBIPERA</h3><p class="muted" style="line-height:1.8">${esc(ABOUT.vision)}</p><h3 style="margin-top:25px">Misi ORBIPERA</h3><ul style="padding-left:19px;line-height:1.9;color:#5c6b85">${ABOUT.mission.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel"><h3>Nilai Utama</h3>${[['🎯','Terarah','Fokus pada kesenjangan kompetensi yang dapat diukur.'],['🤝','Kolaboratif','Menghubungkan HR dan karyawan dalam satu alur.'],['📈','Berkelanjutan','Pembelajaran diikuti evaluasi dan tindak lanjut.']].map(x=>`<div class="lessonitem"><div class="lessonnum">${x[0]}</div><div><h4>${x[1]}</h4><p>${x[2]}</p></div></div>`).join('')}<h3 style="margin-top:22px">Tim Pengembangan</h3><p class="small muted" style="line-height:1.7">Platform ORBIPERA dibangun sebagai rancangan bisnis kelompok. Struktur fungsi pengelolaan mencakup Product & Strategy, Technology, Learning Content, serta Business Development. Nama dan jabatan tidak diada-adakan.</p></div></div><div class="panel"><h3>Hubungi ORBIPERA</h3><p class="muted" style="font-size:13px;line-height:1.7">Dalam versi pengembangan ini kontak eksternal resmi belum tersedia. Untuk kendala pembelajaran dalam perusahaan, gunakan menu Learning Support yang masuk ke HR Admin.</p><button class="btn" onclick="setPage('Bantuan')">Buka Learning Support</button></div>`)}
start();
</script></body></html>
